<!doctype html>
<html lang="en" class="no-theme-transition">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerPilot AI — AI-Powered Job Portal & Career Management Platform</title>
    <meta name="description" content="AI-driven career acceleration: resume analyzer, smart job matching, AI mock interviews, and skill gap roadmaps." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Anti-Flash Theme Script -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('careerpilot-theme');
          var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && supportDark) || (storedTheme === 'system' && supportDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-navy-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-500 selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Remove no-theme-transition after initial render
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          document.documentElement.classList.remove('no-theme-transition');
        }, 100);
      });
    </script>
  </body>
</html>
