services:
  # ----------------------------------------------------
  # 1. MongoDB Database Engine
  # ----------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: careerpilot_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=careerpilot_ai
    volumes:
      - mongo_data:/data/db
    networks:
      - careerpilot_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Node.js Backend REST API
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/careerpilot_ai
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=production_docker_jwt_secret_careerpilot_ai
      - JWT_EXPIRES_IN=7d
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASS=${EMAIL_PASS:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - careerpilot_network

  # ----------------------------------------------------
  # 3. React Frontend (Served via Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerpilot_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend
    networks:
      - careerpilot_network

# ------------------------------------------------------
# Volumes & Networks
# ------------------------------------------------------
volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  careerpilot_network:
    driver: bridge
