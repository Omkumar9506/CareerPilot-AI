name: CareerPilot AI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ----------------------------------------------
      # Backend Testing
      # ----------------------------------------------
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run Backend Automated Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/careerpilot_test
          JWT_SECRET: ci_test_secret_key_minimum_32_characters_1234
        run: npm test

      # ----------------------------------------------
      # Frontend Production Build
      # ----------------------------------------------
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend Static Bundle
        working-directory: ./frontend
        run: npm run build

      # ----------------------------------------------
      # Production Deployment Audit
      # ----------------------------------------------
      - name: Run Production Audit
        working-directory: ./backend
        env:
          NODE_ENV: production
          MONGO_URI: mongodb://127.0.0.1:27017/careerpilot_test
          JWT_SECRET: ci_production_audit_secret_key_32_chars_ok
        run: npm run verify:prod
